name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          GITHUB_OWNER: ci-user
          GITHUB_TOKEN: dummy
          ADMIN_PASSWORD: ci-password-placeholder
          CMS_SESSION_SECRET: ci-secret-placeholder-long-enough-32chars
          GITHUB_REPO: portfolio
        run: npm run build

      - name: Test
        env:
          GITHUB_OWNER: ci-user
          GITHUB_TOKEN: dummy
          ADMIN_PASSWORD: ci-password-placeholder
          CMS_SESSION_SECRET: ci-secret-placeholder-long-enough-32chars
          GITHUB_REPO: portfolio
        run: npm test
